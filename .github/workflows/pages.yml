# Publish the browser build to GitHub Pages.
#
# One link, no install, no unsigned-binary warning, and it works on a phone.
# It is also the build with the fewest unknowns, since development and every
# platform measurement happened against it.
#
# Deploys by pushing to a gh-pages branch rather than using
# actions/deploy-pages. The Pages deployment environment is restricted on
# forks -- the build job succeeded and uploaded its artifact, and the deploy
# job failed at setup with no steps run. The branch method has no such
# restriction.
name: Deploy web app

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
      - run: npm ci
      # --base /Stegstr/ because Pages serves a project site from that prefix;
      # built with the default base, every asset tag 404s.
      - run: npm run build:pages
      - name: Prepare the site
        run: |
          cp dist/index.html dist/404.html   # any unexpected path lands on the app
          touch dist/.nojekyll               # stop Pages hiding files beginning with _
      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -q -m "Browser build from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
